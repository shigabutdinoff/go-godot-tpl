name: sync develop

# Rebase and merge gives the default branch new commits with the same files as develop. develop is moved onto them,
# so the next pull request carries only new work. A develop with unmerged commits differs from the default branch
# and is left as is. push cannot name the default branch, so both usual names are listed; the job runs only on the
# one that is the default.
on:
  push:
    branches: [master, main]

permissions:
  contents: write

jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - run: |
          git rev-parse -q --verify origin/develop >/dev/null || { echo "no develop branch"; exit 0; }
          if [ "$(git rev-parse origin/develop^{tree})" != "$(git rev-parse HEAD^{tree})" ]; then
            echo "develop has unmerged changes; left as is"; exit 0
          fi
          git push --force-with-lease=develop:origin/develop origin HEAD:develop
