name: release

# Runs on request from the Actions tab on the chosen branch and publishes its commit as a GitHub Release of the
# given version, tagging it. Run on master, it leaves the engine cache to every later release: a cache saved on a
# tag would serve only that tag.
on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version vX.Y.Z (vX.Y.Z-rc.N is a prerelease)
        required: true
        type: string
      # Only the ticked archives are built and published; their runners alone start, CI's included.
      darwin-universal:
        description: macOS universal
        type: boolean
        default: true
      darwin-arm64:
        description: macOS arm64
        type: boolean
        default: true
      darwin-amd64:
        description: macOS amd64
        type: boolean
        default: true
      linux-amd64:
        description: Linux amd64
        type: boolean
        default: true
      linux-arm64:
        description: Linux arm64
        type: boolean
        default: true
      windows-amd64:
        description: Windows amd64
        type: boolean
        default: true
      windows-arm64:
        description: Windows arm64
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Checks the inputs before any runner starts and turns the ticked archives into the runners to start.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.plan.outputs.build }}
      ci: ${{ steps.plan.outputs.ci }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DARWIN_UNIVERSAL: ${{ inputs.darwin-universal }}
          DARWIN_ARM64: ${{ inputs.darwin-arm64 }}
          DARWIN_AMD64: ${{ inputs.darwin-amd64 }}
          LINUX_AMD64: ${{ inputs.linux-amd64 }}
          LINUX_ARM64: ${{ inputs.linux-arm64 }}
          WINDOWS_AMD64: ${{ inputs.windows-amd64 }}
          WINDOWS_ARM64: ${{ inputs.windows-arm64 }}
        run: |
          # A version is SemVer: v1.2.3 or v1.2.3-rc.1.
          if ! echo "$VERSION" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "version $VERSION is not a SemVer version vX.Y.Z" >&2; exit 1
          fi
          # The tag appears when the release is published: an existing one means the version is out.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$VERSION" >/dev/null 2>&1; then
            echo "version $VERSION is already released; give a new one" >&2; exit 1
          fi
          # gd builds a universal .app by default; GOARCH narrows it down to one architecture.
          # gd cross-compiles macOS and Windows with zig and an LLVM it downloads for the host, which
          # release.graphics.gd has no build of for darwin/amd64 and windows/arm64: those two targets are
          # built on the other architecture's runner.
          build=
          add() { [ -z "$2" ] || build="$build${build:+,}{\"runner\":\"$1\",\"goarchs\":\"${2# }\"}"; }
          mac=; win=
          [ "$DARWIN_UNIVERSAL" = true ] && mac="$mac universal"
          [ "$DARWIN_ARM64" = true ] && mac="$mac arm64"
          [ "$DARWIN_AMD64" = true ] && mac="$mac amd64"
          [ "$WINDOWS_AMD64" = true ] && win="$win amd64"
          [ "$WINDOWS_ARM64" = true ] && win="$win arm64"
          add macos-15 "$mac"
          [ "$LINUX_AMD64" = true ] && add ubuntu-24.04 amd64
          [ "$LINUX_ARM64" = true ] && add ubuntu-24.04-arm arm64
          add windows-2025 "$win"
          [ -n "$build" ] || { echo "no platform is ticked: tick at least one" >&2; exit 1; }
          # CI checks each ticked OS and architecture on its own runner; ubuntu-24.04 runs the linters every time.
          ci='"ubuntu-24.04"'
          case "$mac" in *universal*|*arm64*) ci="$ci,\"macos-26\"" ;; esac
          case "$mac" in *universal*|*amd64*) ci="$ci,\"macos-15-intel\"" ;; esac
          [ "$LINUX_ARM64" = true ] && ci="$ci,\"ubuntu-24.04-arm\""
          [ "$WINDOWS_AMD64" = true ] && ci="$ci,\"windows-2025\""
          [ "$WINDOWS_ARM64" = true ] && ci="$ci,\"windows-11-arm\""
          echo "build=[$build]" | tee -a "$GITHUB_OUTPUT"
          echo "ci=[$ci]" | tee -a "$GITHUB_OUTPUT"

  # A release is built only from a commit that passes CI.
  ci:
    needs: plan
    uses: ./.github/workflows/ci.yml
    with:
      runners: ${{ needs.plan.outputs.ci }}

  build:
    needs: [plan, ci]
    strategy:
      # A failed target must not cancel the engine build of the others: their cache would be lost.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.build) }}
    runs-on: ${{ matrix.runner }}
    # A cold engine build takes up to an hour (windows-2025 builds two); a hung clone or scons must not
    # hold the runner for 6 hours.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - name: name and version
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          GOARCHS: ${{ matrix.goarchs }}
        run: |
          set -- cmd/*/graphics/project.godot
          [ $# -eq 1 ] && [ -e "$1" ] || { echo "expected exactly one cmd/<name>/graphics" >&2; exit 1; }
          echo "name=$(basename "$(dirname "$(dirname "$1")")")" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "engines=$(echo "$GOARCHS" | tr ' ' -)" >> "$GITHUB_OUTPUT"
      # gd keeps its tools (zig, LLVM, Python, scons, the Godot editor) and the built engines in ~/gd.
      # The key names the architectures built: a cache saved for fewer of them would never take the engines of
      # the rest. Without its own, a run goes on from its partial cache (see the save steps below) or from the
      # latest one of any other choice of architectures.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: gd-${{ matrix.runner }}-${{ hashFiles('go.sum', 'cmd/*/graphics/project.godot') }}-${{ steps.meta.outputs.engines }}
          restore-keys: |
            gd-${{ matrix.runner }}-${{ hashFiles('go.sum', 'cmd/*/graphics/project.godot') }}-${{ steps.meta.outputs.engines }}-partial-
            gd-${{ matrix.runner }}-${{ hashFiles('go.sum', 'cmd/*/graphics/project.godot') }}
          path: ~/gd
      # With vulkan=yes in engine/options gd links MoltenVK into the .app. Homebrew's has only the
      # runner's architecture, the universal .app needs both: the release goes where gd and scons look.
      - name: MoltenVK
        if: runner.os == 'macOS'
        run: |
          grep -Eiq '^engine/options=.*vulkan=(y|yes|t|true|1|on|all)\b' cmd/*/graphics/project.godot || exit 0
          curl -fsSL --retry 3 --retry-all-errors -o "$RUNNER_TEMP/mvk.tar" https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.2/MoltenVK-macos.tar
          echo "f95765a6229cb7b915990a2890ce12ebe36a730b021545d3d52ae69ce4c4024e  $RUNNER_TEMP/mvk.tar" | shasum -a 256 -c
          tar -xf "$RUNNER_TEMP/mvk.tar" -C "$RUNNER_TEMP" MoltenVK/MoltenVK/static/MoltenVK.xcframework
          sudo mkdir -p /usr/local/homebrew/Frameworks
          sudo mv "$RUNNER_TEMP/MoltenVK/MoltenVK/static/MoltenVK.xcframework" /usr/local/homebrew/Frameworks/
      # The first build of the engine takes 20-60 minutes, later runs only link the Go code.
      - name: build and pack
        env:
          NAME: ${{ steps.meta.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
          GOARCHS: ${{ matrix.goarchs }}
        run: |
          ldflags="-s -w -X main.buildVersion=$VERSION -X main.buildDate=$(date -u +%FT%TZ) -X main.buildCommit=$(git rev-parse --short HEAD)"
          releases=$PWD/cmd/$NAME/releases
          mkdir dist
          # gd is built once for the runner: GOARCH=arm64 go tool gd would build gd itself for arm64,
          # which an x64 Windows cannot start.
          GD_BIN=$(go tool -n gd)
          export GD_BIN GD_LDFLAGS=$ldflags
          gd() {
            if [ "$RUNNER_OS" = Windows ]; then
              # Under the runner's MSYSTEM (UCRT64) Godot's SCons allows only an x86_64 engine. bash's unset
              # did not keep it from SCons: PowerShell drops it before starting gd.
              pwsh -NoProfile -Command 'Remove-Item Env:MSYSTEM -ErrorAction Ignore; & $env:GD_BIN build -ldflags $env:GD_LDFLAGS; exit $LASTEXITCODE'
            else
              "$GD_BIN" build -ldflags "$GD_LDFLAGS"
            fi
          }
          for goarch in $GOARCHS; do
            archive=$PWD/dist/$NAME-$VERSION-$(go env GOOS)-$goarch
            if [ "$goarch" = universal ]; then
              (cd "cmd/$NAME" && gd)
            else
              (cd "cmd/$NAME" && GOARCH=$goarch gd)
            fi
            case "$RUNNER_OS" in
              macOS)
                # gd drops underscores from the name of an Apple bundle.
                app=$(echo "$NAME" | tr -d _).app
                bin=$(ls "$releases/darwin/$goarch/$app"/Contents/MacOS/* | head -1)
                (cd "$releases/darwin/$goarch" && zip -qry "$archive.zip" "$app")
                archive=$archive.zip ;;
              Linux)
                bin=$releases/musl/$goarch/$NAME
                tar -czf "$archive.tar.gz" -C "$releases/musl/$goarch" "$NAME"
                archive=$archive.tar.gz ;;
              Windows)
                bin=$releases/windows/$goarch/$NAME.exe
                pwsh -NoProfile -Command "Compress-Archive -Path '$(cygpath -w "$bin")' -DestinationPath '$(cygpath -w "$archive.zip")'"
                archive=$archive.zip ;;
            esac
            # The release starts on its OS and carries its version. -version exits before the engine starts:
            # graphics.gd strips --headless from a release's arguments, so -- --headless --quit would open a window.
            # macOS runs amd64 through Rosetta; an x64 Windows cannot run arm64.
            if [ "$RUNNER_OS" = Windows ] && [ "$goarch" != "$(go env GOHOSTARCH)" ]; then
              echo "skipping -version: windows/$goarch does not run on $(go env GOHOSTARCH)"
            else
              got=$("$bin" -version)
              got=${got%%$'\n'*}
              [ "$got" = "Build version: $VERSION" ] || { echo "$bin -version: got \"$got\"" >&2; exit 1; }
            fi
            (cd dist && { sha256sum "${archive##*/}" 2>/dev/null || shasum -a 256 "${archive##*/}"; } > "${archive##*/}.sha256")
          done
          ls -l dist
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: gd-${{ matrix.runner }}-${{ hashFiles('go.sum', 'cmd/*/graphics/project.godot') }}-${{ steps.meta.outputs.engines }}
          path: ~/gd
      # A cache key never changes once saved: a failed build saved under the main key would keep a later
      # successful one from saving the whole engine, so it goes under a key of its own.
      - if: failure() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: gd-${{ matrix.runner }}-${{ hashFiles('go.sum', 'cmd/*/graphics/project.godot') }}-${{ steps.meta.outputs.engines }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
          path: ~/gd
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ steps.meta.outputs.name }}-${{ steps.meta.outputs.version }}-${{ matrix.runner }}
          path: dist/*
          if-no-files-found: error

  # The engine starts the scene and quits: catches a broken graphics/ or LibGodot link that unit tests miss.
  # A release starts the engine only this way (it drops --headless). It is not in CI, where a cold LibGodot
  # build would hold a pull request: it runs alongside the builds, and the release waits for it.
  engine:
    needs: plan
    runs-on: ubuntu-24.04
    # A cold LibGodot build takes up to an hour, later runs take it from the cache.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      # go tool libgodot keeps Godot sources and LibGodot in the user cache; the key follows the kit version.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: libgodot-ubuntu-24.04-${{ hashFiles('go.sum') }}
          path: ~/.cache/go-godot-kit
      # scons pinned: the LibGodot build must not change with the runner image.
      - run: pipx install scons==4.11.1
      - run: go tool libgodot
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: libgodot-ubuntu-24.04-${{ hashFiles('go.sum') }}
          path: ~/.cache/go-godot-kit
      # The game is cmd/<name>: a game made from the template renames cmd/game.
      - run: |
          set -- cmd/*/graphics/project.godot
          [ $# -eq 1 ] && [ -e "$1" ] || { echo "expected exactly one cmd/<name>/graphics" >&2; exit 1; }
          go run "./${1%/graphics/project.godot}" -- --headless --quit

  release:
    needs: [build, engine]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        # The release is a draft until every asset is uploaded, and its tag is made on this commit when it is
        # published: a rerun after a failed run replaces the draft's assets, but a published release never changes.
        # A version with a suffix (v1.2.3-rc.1) is a prerelease, so it never becomes Latest.
        run: |
          tag=$VERSION
          export GH_REPO=$GITHUB_REPOSITORY
          pre=; case "$tag" in *-*) pre=--prerelease ;; esac
          if draft=$(gh release view "$tag" --json isDraft -q .isDraft 2>/dev/null); then
            [ "$draft" = true ] || { echo "release $tag is already published; give a new version" >&2; exit 1; }
            # A draft left by a run on another commit is moved to this one.
            gh release edit "$tag" --target "$GITHUB_SHA"
            gh release upload "$tag" --clobber dist/*
          else
            gh release create "$tag" --draft $pre --target "$GITHUB_SHA" --title "$tag" dist/*
          fi
          gh release edit "$tag" --draft=false
