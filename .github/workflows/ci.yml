name: ci

on:
  # Code is checked in its pull request. On the default branch CI runs only to fill the cache that every branch
  # reads: its keys follow go.sum and the Go version in go.mod. push cannot name the default branch, so both usual
  # names are listed; the job runs only on the one that is the default.
  push:
    branches: [master, main]
    paths: [go.mod, go.sum]
  pull_request:
  # release runs CI on its commit before building, on the runners of the platforms it builds for.
  workflow_call:
    inputs:
      runners:
        type: string

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Every default branch commit is checked to the end.
# Called from release, github.workflow is "release": its CI never cancels or is cancelled by this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # A pull request and the default branch are checked on one Linux runner in minutes; release adds the runners of
  # the platforms it builds for (macos-26, macos-15-intel, ubuntu-24.04-arm, windows-2025, windows-11-arm).
  check:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    strategy:
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # The gcc on the windows-11-arm PATH is x86_64 mingw: it cannot build runtime/cgo for arm64.
    env:
      CGO_ENABLED: ${{ matrix.runner == 'windows-11-arm' && '0' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The race detector on Windows supports only amd64.
      - run: go test ${{ matrix.runner != 'windows-11-arm' && '-race' || '' }} -coverprofile=coverage.out ./...
      # Every runner lints its own GOOS files; the release files (tag archive or musl) are linted once.
      - run: go tool staticlint ./...
      - if: matrix.runner == 'ubuntu-24.04'
        run: go tool staticlint ./...
        env:
          GOFLAGS: -tags=archive
      - if: matrix.runner == 'ubuntu-24.04'
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9
        with:
          version: v2.15.0
      # Every runner checks its own GOOS files. A report without the total line fails the step.
      - name: coverage at least COVERAGE_MIN
        env:
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN || 70 }}
        run: |
          go tool cover -func=coverage.out | awk -v min="$COVERAGE_MIN" '
            /^total:/ { found = 1; sub("%", "", $3); print "coverage " $3 "%, minimum " min "%"; if ($3 + 0 < min + 0) exit 1 }
            END { if (!found) { print "no total line in the coverage report"; exit 1 } }'
      # Windows files without cgo, cross-compiled from Linux.
      - if: matrix.runner == 'ubuntu-24.04'
        run: GOOS=windows go vet ./... && GOOS=windows go build -o /dev/null ./...
      # Before Trivy, which keeps its cache in the work tree.
      - name: generated code is up to date
        if: matrix.runner == 'ubuntu-24.04'
        run: go generate ./... && test -z "$(git status --porcelain)"
      # Known vulnerabilities in go.mod/go.sum. Pinned to v0.36.0, released after the March 2026 tag hijack.
      - if: matrix.runner == 'ubuntu-24.04'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
