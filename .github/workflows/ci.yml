name: ci

on:
  # Code is checked in its pull request. On master CI runs only to fill the cache that every branch reads:
  # its keys follow go.sum and the Go version in go.mod.
  push:
    branches: [master]
    paths: [go.mod, go.sum]
  pull_request:
  # release runs CI on its commit before building.
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels its previous run. Every master commit is checked to the end.
# Called from release, github.workflow is "release": its CI never cancels or is cancelled by this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  check:
    strategy:
      matrix:
        runner: [macos-26, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2025, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # The gcc on the windows-11-arm PATH is x86_64 mingw: it cannot build runtime/cgo for arm64.
    env:
      CGO_ENABLED: ${{ matrix.runner == 'windows-11-arm' && '0' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # The race detector on Windows supports only amd64.
      - run: go test ${{ matrix.runner != 'windows-11-arm' && '-race' || '' }} -coverprofile=coverage.out ./...
      # Every runner lints its own GOOS files; the release files (tag archive or musl) are linted once.
      - run: go tool staticlint ./...
      - if: matrix.runner == 'macos-26'
        run: go tool staticlint ./...
        env:
          GOFLAGS: -tags=archive
      - if: matrix.runner == 'macos-26'
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9
        with:
          version: v2.15.0
      # Every runner checks its own GOOS files. A report without the total line fails the step.
      - name: coverage at least COVERAGE_MIN
        env:
          COVERAGE_MIN: ${{ vars.COVERAGE_MIN || 70 }}
        run: |
          go tool cover -func=coverage.out | awk -v min="$COVERAGE_MIN" '
            /^total:/ { found = 1; sub("%", "", $3); print "coverage " $3 "%, minimum " min "%"; if ($3 + 0 < min + 0) exit 1 }
            END { if (!found) { print "no total line in the coverage report"; exit 1 } }'
      # Windows files without cgo, cross-compiled from macOS.
      - if: matrix.runner == 'macos-26'
        run: GOOS=windows go vet ./... && GOOS=windows go build -o /dev/null ./...
      # Known vulnerabilities in go.mod/go.sum. Pinned to v0.36.0, released after the March 2026 tag hijack.
      - if: matrix.runner == 'ubuntu-24.04'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: 1
      - name: generated code is up to date
        if: matrix.runner == 'macos-26'
        run: go generate ./... && test -z "$(git status --porcelain)"

  # The engine starts the scene and quits: catches a broken graphics/ or LibGodot link that unit tests miss.
  engine:
    runs-on: ubuntu-24.04
    # A cold LibGodot build takes up to an hour, later runs take it from the cache.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
      # go tool libgodot keeps Godot sources and LibGodot in the user cache; the key follows the kit version.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: libgodot-ubuntu-24.04-${{ hashFiles('go.sum') }}
          path: ~/.cache/go-godot-kit
      # scons pinned: the LibGodot build must not change with the runner image.
      - run: pipx install scons==4.11.1
      - run: go tool libgodot
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          key: libgodot-ubuntu-24.04-${{ hashFiles('go.sum') }}
          path: ~/.cache/go-godot-kit
      # The game is cmd/<name>: a game made from the template renames cmd/game.
      - run: |
          set -- cmd/*/graphics/project.godot
          [ $# -eq 1 ] && [ -e "$1" ] || { echo "expected exactly one cmd/<name>/graphics" >&2; exit 1; }
          go run "./${1%/graphics/project.godot}" -- --headless --quit
