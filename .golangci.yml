version: "2"
linters:
  enable:
    - errcheck
    - errorlint
    - govet
    - staticcheck
    - gocyclo
    - unused
    - revive
  settings:
    revive:
      rules:
        - name: exported
        - name: package-comments
    # mirrors staticcheck.conf (golangci-lint v2 does not read it)
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023"]
      initialisms: ["ACL", "API", "ASCII", "CPU", "CSS", "DNS", "EOF", "GUID", "HTML", "HTTP", "HTTPS", "ID", "IP", "JSON", "QPS", "RAM", "RPC", "SLA", "SMTP", "SQL", "SSH", "TCP", "TLS", "TTL", "UDP", "UI", "GID", "UID", "UUID", "URI", "URL", "UTF8", "VM", "XML", "XMPP", "XSRF", "XSS", "SIP", "RTP", "AMQP", "DB", "TS"]
    govet:
      enable:
        - shadow
    gocyclo:
      min-complexity: 15
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/shigabutdinoff/go-godot-tpl
